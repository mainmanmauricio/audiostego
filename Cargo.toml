[package]
name = "audiostego"
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
description = "FFT-domain audio steganography CLI"
license = "GPL-2.0-only"
readme = "README.md"
authors = ["Maurice.Gittens <567431+mainmanmauricio@users.noreply.github.com>"]
default-run = "audiostego"

[[bin]]
name = "audiostego"
path = "src/main.rs"

[[bin]]
name = "ber_sweep"
path = "src/bin/ber_sweep.rs"

[lib]
name = "audiostego"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
bitvec = "1.0"
chacha20poly1305 = "0.10"
clap = { version = "4.4", features = ["derive"] }
crc32fast = "1.3"
hound = "3.5"
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
realfft = "3.3"
reed-solomon = "0.2"
rubato = "0.14"
rustfft = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "pcm", "wav", "isomp4"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.8"

[features]
default = []
native-codecs = []

[profile.release]
lto = true
codegen-units = 1

# Local packaging: `cargo deb` / `cargo generate-rpm` (see README).
# Ships only the `audiostego` CLI — not `ber_sweep`.
[package.metadata.deb]
maintainer = "Maurice.Gittens <567431+mainmanmauricio@users.noreply.github.com>"
copyright = "2024–2026 Maurice Gittens"
license-file = ["LICENSE", "0"]
extended-description = """\
Embed and recover short messages in audio via FFT-domain steganography.\n\
\n\
Supports multiple embedding strategies and channel modes. Non-WAV formats\n\
require ffmpeg at runtime. See /usr/share/doc/audiostego/USER_GUIDE.md.\
"""
depends = "$auto, ffmpeg"
section = "sound"
priority = "optional"
assets = [
    ["target/release/audiostego", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/audiostego/", "644"],
    ["docs/USER_GUIDE.md", "usr/share/doc/audiostego/", "644"],
    ["LICENSE", "usr/share/doc/audiostego/", "644"],
]

[package.metadata.generate-rpm]
# Disable auto shlib discovery noise; declare ffmpeg explicitly.
auto-req = "no"
require-sh = false
assets = [
    { source = "target/release/audiostego", dest = "/usr/bin/", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/audiostego/", mode = "644", doc = true },
    { source = "docs/USER_GUIDE.md", dest = "/usr/share/doc/audiostego/", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/audiostego/", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
ffmpeg = "*"
